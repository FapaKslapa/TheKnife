<!doctype html>
<html data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>I miei ristoranti - TheKnife</title>
    <link href="https://fonts.googleapis.com/css?family=Lexend:300,400,500,600,700" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css"
          href="https://cdn.jsdelivr.net/gh/exacti/floating-labels@latest/floating-labels.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- Effetto sfondo bolle -->
<div class="floating-elements">
    <div class="element" style="left: 10%; animation-delay: 0s; animation-duration: 12s;"></div>
    <div class="element" style="left: 20%; animation-delay: 1s; animation-duration: 15s;"></div>
    <div class="element" style="left: 35%; animation-delay: 2s; animation-duration: 10s;"></div>
    <div class="element" style="left: 50%; animation-delay: 3s; animation-duration: 18s;"></div>
    <div class="element" style="left: 65%; animation-delay: 4s; animation-duration: 14s;"></div>
    <div class="element" style="left: 80%; animation-delay: 5s; animation-duration: 16s;"></div>
    <div class="element" style="left: 90%; animation-delay: 6s; animation-duration: 13s;"></div>
</div>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img src="../assets/Logo.png" alt="TheKnife" width="80">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link me-2" href="#" data-bs-toggle="modal" data-bs-target="#nuovoRistoranteModal">
                        <img src="../assets/icons/add.svg" alt="" class="material-symbols-rounded"> Nuovo
                        ristorante
                    </a>
                </li>
                <li class="nav-item">
                    <span class="nav-link" id="username-display"></span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="index.html" id="logout-link"> <img src="../assets/icons/logout.svg" alt=""
                                                                                 class="material-symbols-rounded">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>I miei ristoranti</h2>
    </div>

    <div id="alertArea"></div>

    <div class="row" id="ristoranti-container">
        <!-- I ristoranti verranno caricati dinamicamente qui -->
        <div class="col-12 text-center py-5" id="loading-indicator">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Caricamento...</span>
            </div>
            <p class="mt-2">Caricamento ristoranti...</p>
        </div>

        <div class="col-12 text-center py-5 d-none" id="no-ristoranti">
            <div class="empty-state">
                <span class="material-symbols-rounded display-1">restaurant</span>
                <h3 class="mt-3">Nessun ristorante trovato</h3>
                <p class="text-muted">Inizia aggiungendo il tuo primo ristorante!</p>
            </div>
        </div>
    </div>
</div>

<!-- Modal a tutto schermo per nuovo ristorante -->
<div class="modal fade" id="nuovoRistoranteModal" tabindex="-1" aria-labelledby="nuovoRistoranteModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="nuovoRistoranteModalLabel">Crea nuovo ristorante</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
            </div>
            <div class="modal-body">
                <div class="container-fluid">
                    <form id="nuovoRistoranteForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <div class="form-label-group outline">
                                    <input type="text" id="nome" class="form-control" placeholder=" " required>
                                    <span><label for="nome" class="text-white">Nome del ristorante</label></span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-label-group outline">
                                    <input type="text" id="tipoCucina" class="form-control" placeholder=" " required>
                                    <span><label for="tipoCucina" class="text-white">Tipo di cucina</label></span>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fasciaPrezzo" class="form-label">Fascia di prezzo</label>
                                <select id="fasciaPrezzo" class="form-select" required>
                                    <option value="1">€ - Economico</option>
                                    <option value="2">€€ - Medio</option>
                                    <option value="3">€€€ - Costoso</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-label-group outline">
                                    <input type="tel" id="numeroTelefono" class="form-control" placeholder=" " required>
                                    <span><label for="numeroTelefono"
                                                 class="text-white">Numero di telefono</label></span>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <div class="form-label-group outline">
                                    <input type="number" step="0.000001" id="latitudine" class="form-control"
                                           placeholder=" " required>
                                    <span><label for="latitudine" class="text-white">Latitudine</label></span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-label-group outline">
                                    <input type="number" step="0.000001" id="longitudine" class="form-control"
                                           placeholder=" " required>
                                    <span><label for="longitudine" class="text-white">Longitudine</label></span>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="consegnaDomicilio">
                                <label class="form-check-label" for="consegnaDomicilio">Consegna a domicilio</label>
                            </div>
                        </div>

                        <h5 class="mt-4 mb-3">Orari di apertura</h5>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Lunedì</label>
                                <div class="input-group">
                                    <input type="text" class="form-control orario-input"
                                           placeholder="Es. 12:00-15:00, 19:00-23:00" id="orariLunedi">
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Martedì</label>
                                <div class="input-group">
                                    <input type="text" class="form-control orario-input"
                                           placeholder="Es. 12:00-15:00, 19:00-23:00" id="orariMartedi">
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Mercoledì</label>
                                <div class="input-group">
                                    <input type="text" class="form-control orario-input"
                                           placeholder="Es. 12:00-15:00, 19:00-23:00" id="orariMercoledi">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Giovedì</label>
                                <div class="input-group">
                                    <input type="text" class="form-control orario-input"
                                           placeholder="Es. 12:00-15:00, 19:00-23:00" id="orariGiovedi">
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Venerdì</label>
                                <div class="input-group">
                                    <input type="text" class="form-control orario-input"
                                           placeholder="Es. 12:00-15:00, 19:00-23:00" id="orariVenerdi">
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Sabato</label>
                                <div class="input-group">
                                    <input type="text" class="form-control orario-input"
                                           placeholder="Es. 12:00-15:00, 19:00-23:00" id="orariSabato">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Domenica</label>
                                <div class="input-group">
                                    <input type="text" class="form-control orario-input"
                                           placeholder="Es. 12:00-15:00, 19:00-23:00" id="orariDomenica">
                                </div>
                            </div>
                        </div>

                        <div id="modalAlertArea" class="mt-3"></div>
                    </form>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                <button type="button" class="btn btn-primary" id="salvaRistorante">Crea ristorante</button>
            </div>
        </div>
    </div>
</div>

<script src="./src/homeristoratore.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Gestione del form di creazione ristorante

    });
</script>
</body>
</html>
