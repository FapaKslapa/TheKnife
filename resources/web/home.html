<!doctype html>
<html data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - TheKnife</title>
    <link href="https://fonts.googleapis.com/css?family=Lexend" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="sfondo">
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="../assets/Logo.png" alt="TheKnife" width="80">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="ristorantiLink">Ristoranti</a>
                </li>
                <li class="nav-item" id="gestioneRistorantiItem" style="display: none;">
                    <a class="nav-link" href="#">I miei ristoranti</a>
                </li>
            </ul>
            <div class="d-flex">
                <span id="usernameDisplay" class="navbar-text me-3"></span>
                <button id="logoutBtn" class="btn btn-outline-primary">Logout</button>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div id="welcomeMessage" class="mb-4">
        <h2>Benvenuto su TheKnife</h2>
        <p>Scopri i migliori ristoranti e condividi le tue esperienze!</p>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card bg-dark">
                <div class="card-body">
                    <h3 class="card-title">Ristoranti in evidenza</h3>
                    <div id="ristorantiList" class="mt-3">
                        <div id="loadingRestaurants" class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Caricamento...</span>
                            </div>
                            <p>Caricamento ristoranti...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-dark">
                <div class="card-body">
                    <h3 class="card-title">Il tuo profilo</h3>
                    <div id="profileInfo" class="mt-3">
                        <p>Username: <span id="profileUsername"></span></p>
                        <p>Email: <span id="profileEmail"></span></p>
                        <p>Ruolo: <span id="profileRuolo"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Controlla se l'utente è loggato
    document.addEventListener('DOMContentLoaded', function () {
        const isLoggedIn = sessionStorage.getItem('isLoggedIn');

        if (!isLoggedIn || isLoggedIn !== 'true') {
            // Redirect a login se non è loggato
            window.location.href = 'login.html';
            return;
        }

        // Carica dati utente dal sessionStorage
        const username = sessionStorage.getItem('username');
        const email = sessionStorage.getItem('email');
        const ruolo = sessionStorage.getItem('ruolo');
        const userId = sessionStorage.getItem('userId');

        // Popola gli elementi HTML con i dati dell'utente
        document.getElementById('usernameDisplay').textContent = username;
        document.getElementById('profileUsername').textContent = username;
        document.getElementById('profileEmail').textContent = email;
        document.getElementById('profileRuolo').textContent = ruolo === 'RISTORATORE' ? 'Ristoratore' : 'Utente standard';

        // Mostra link gestione ristoranti solo per i ristoratori
        if (ruolo === 'RISTORATORE') {
            document.getElementById('gestioneRistorantiItem').style.display = 'block';
        }

        // Carica i ristoranti in evidenza
        loadFeaturedRestaurants();

        // Gestione del logout
        document.getElementById('logoutBtn').addEventListener('click', function () {
            // Pulisci session storage
            sessionStorage.clear();
            // Redirect alla pagina di login
            window.location.href = 'login.html';
        });
    });

    function loadFeaturedRestaurants() {
        window.javaConnector.getAllRistoranti({})
            .then(response => {
                const container = document.getElementById('ristorantiList');
                document.getElementById('loadingRestaurants').style.display = 'none';

                if (response.success && response.ristoranti && response.ristoranti.length > 0) {
                    const ristoranti = response.ristoranti.slice(0, 5); // Prendi i primi 5 ristoranti

                    let html = '<div class="list-group">';
                    ristoranti.forEach(ristorante => {
                        html += `
                            <a href="#" class="list-group-item list-group-item-action bg-dark"
                               onclick="viewRestaurant('${ristorante.id}')">
                                <div class="d-flex w-100 justify-content-between">
                                    <h5 class="mb-1">${ristorante.nome}</h5>
                                    <small>${getPriceRange(ristorante.fasciaPrezzo)}</small>
                                </div>
                                <p class="mb-1">Cucina: ${ristorante.tipoCucina}</p>
                                <small>${ristorante.consegnaDomicilio ? 'Disponibile per consegna a domicilio' : 'Solo al locale'}</small>
                            </a>
                        `;
                    });
                    html += '</div>';

                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p>Nessun ristorante disponibile al momento.</p>';
                }
            })
            .catch(error => {
                document.getElementById('loadingRestaurants').style.display = 'none';
                document.getElementById('ristorantiList').innerHTML =
                    `<p class="text-danger">Errore durante il caricamento dei ristoranti: ${error}</p>`;
            });
    }

    function getPriceRange(fasciaPrezzo) {
        return '€'.repeat(fasciaPrezzo) + '○'.repeat(5 - fasciaPrezzo);
    }

    function viewRestaurant(id) {
        // Qui implementerai la visualizzazione del dettaglio ristorante
        console.log("Visualizzazione ristorante ID: " + id);
        // Per ora è solo un placeholder
        alert("Visualizzazione dettagli ristorante: " + id);
    }
</script>
</body>
</html>
