<!doctype html>
<html data-bs-theme="dark" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Accedi alla piattaforma TheKnife per scoprire e recensire i migliori ristoranti">
    <title>Accedi - TheKnife</title>
    <!-- Font e stili -->
    <link href="https://fonts.googleapis.com/css?family=Lexend:300,400,500,600,700" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/exacti/floating-labels@latest/floating-labels.min.css" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <!-- Effetto sfondo animato -->
    <div class="floating-elements">
        <div class="element" style="left: 10%; animation-delay: 0s; animation-duration: 12s;"></div>
        <div class="element" style="left: 25%; animation-delay: 1.5s; animation-duration: 15s;"></div>
        <div class="element" style="left: 40%; animation-delay: 2.7s; animation-duration: 10s;"></div>
        <div class="element" style="left: 55%; animation-delay: 3.2s; animation-duration: 18s;"></div>
        <div class="element" style="left: 70%; animation-delay: 4.5s; animation-duration: 14s;"></div>
        <div class="element" style="left: 85%; animation-delay: 5.3s; animation-duration: 16s;"></div>
    </div>

    <!-- Barra di navigazione -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark-subtle shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="homeutente.html">
                <img src="../assets/Logo.png" alt="TheKnife" width="60" class="me-2">
                <span class="brand-text">TheKnife</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Menu" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="homeutente.html"><i class="bi bi-house-door me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#" aria-current="page"><i class="bi bi-box-arrow-in-right me-1"></i>Accedi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html"><i class="bi bi-person-plus me-1"></i>Registrati</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenitore principale -->
    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-card">
                    <h2 class="text-center mb-4">
                        <i class="bi bi-shield-lock me-2"></i>Accedi a TheKnife
                    </h2>

                    <form id="loginForm">
                        <div class="mb-4">
                            <div class="form-label-group outline">
                                <input type="text" id="usernameOrEmail" class="form-control" placeholder=" " required autocomplete="username">
                                <span><label for="usernameOrEmail" class="text-white">Username o Email</label></span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-label-group outline">
                                <input type="password" id="password" class="form-control" placeholder=" " required autocomplete="current-password">
                                <span><label for="password" class="text-white">Password</label></span>
                            </div>
                        </div>

                        <div id="alertArea" role="alert"></div>

                        <button type="submit" class="btn btn-primary mb-3 py-2 btn-gradient">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Accedi
                        </button>

                        <div class="text-center mt-4">
                            <p>Non hai un account? <a href="register.html" class="text-decoration-none transition-link">Registrati</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./src/script.js"></script>
</body>
</html>
