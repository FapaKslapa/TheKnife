<!doctype html>
<html data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registra Utente</title>
    <link href="https://fonts.googleapis.com/css?family=Lexend" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" type="text/css"
          href="https://cdn.jsdelivr.net/gh/exacti/floating-labels@latest/floating-labels.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="sfondo">
<nav class="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="../assets/Logo.png" alt="TheKnife" width="80">
        </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Registra Nuovo Utente</h2>

            <form id="userForm">
                <div class="mb-3">
                    <div class="form-label-group outline">
                        <input type="text" id="username" class="form-control" required>
                        <span><label for="username" class="text-white">Username</label></span>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="form-label-group outline">
                        <input type="email" id="email" class="form-control" required>
                        <span><label for="email" class="text-white">Email</label></span>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="form-label-group outline">
                        <input type="password" id="password" class="form-control" required>
                        <span><label for="password" class="text-white">Password</label></span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Tipo di utente</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="ruolo" id="utente" value="UTENTE" checked>
                        <label class="form-check-label" for="utente">Utente</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="ruolo" id="ristoratore" value="RISTORATORE">
                        <label class="form-check-label" for="ristoratore">Ristoratore</label>
                    </div>
                </div>

                <div id="alertArea"></div>

                <button type="submit" class="btn btn-primary">Registra Utente</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('userForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const ruolo = document.querySelector('input[name="ruolo"]:checked').value;

        window.javaConnector.registraUtente({
            username: username,
            password: password,
            email: email,
            ruolo: ruolo
        })
            .then(response => {
                const alertArea = document.getElementById('alertArea');

                if (response.success) {
                    alertArea.innerHTML = `
                        <div class="alert alert-success" role="alert">
                            Utente registrato con successo!
                        </div>`;
                    document.getElementById('userForm').reset();
                } else {
                    alertArea.innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            Errore: ${response.error}
                        </div>`;
                }
            })
            .catch(error => {
                document.getElementById('alertArea').innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        Errore di sistema: ${error}
                    </div>`;
            });
    });
</script>
</body>
</html>
