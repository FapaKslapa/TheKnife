<!doctype html>
<html data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrazione - TheKnife</title>
    <link href="https://fonts.googleapis.com/css?family=Lexend:300,400,500,600,700" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" type="text/css"
          href="https://cdn.jsdelivr.net/gh/exacti/floating-labels@latest/floating-labels.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- Effetto sfondo elementi fluttuanti -->
<div class="floating-elements">
    <div class="element" style="left: 10%; animation-delay: 0s; animation-duration: 12s;"></div>
    <div class="element" style="left: 20%; animation-delay: 1s; animation-duration: 15s;"></div>
    <div class="element" style="left: 35%; animation-delay: 2s; animation-duration: 10s;"></div>
    <div class="element" style="left: 50%; animation-delay: 3s; animation-duration: 18s;"></div>
    <div class="element" style="left: 65%; animation-delay: 4s; animation-duration: 14s;"></div>
    <div class="element" style="left: 80%; animation-delay: 5s; animation-duration: 16s;"></div>
    <div class="element" style="left: 90%; animation-delay: 6s; animation-duration: 13s;"></div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark-subtle shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="../assets/Logo.png" alt="TheKnife" width="60" class="me-2">
            <span class="brand-text">TheKnife</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="homeutente.html"><i class="bi bi-house-door me-1"></i>Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="index.html"><i class="bi bi-arrow-left me-1"></i>Torna al login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="#"><i class="bi bi-person-plus me-1"></i>Registrati</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="login-card">
                <h2 class="text-center mb-4"><i class="bi bi-person-plus-fill me-2"></i>Registrati a TheKnife</h2>

                <form id="registerForm">
                    <div class="mb-4">
                        <div class="form-label-group outline">
                            <input type="text" id="username" class="form-control" placeholder=" " required>
                            <span><label for="username" class="text-white">Username</label></span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="form-label-group outline">
                            <input type="email" id="email" class="form-control" placeholder=" " required>
                            <span><label for="email" class="text-white">Email</label></span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="form-label-group outline">
                            <input type="password" id="password" class="form-control" placeholder=" " required>
                            <span><label for="password" class="text-white">Password</label></span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-white mb-2"><i class="bi bi-person-badge me-1"></i>Seleziona ruolo:</label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="ruolo" id="ruoloUtente"
                                       value="UTENTE" checked>
                                <label class="form-check-label text-white" for="ruoloUtente">
                                    Utente
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="ruolo" id="ruoloRistoratore"
                                       value="RISTORATORE">
                                <label class="form-check-label text-white" for="ruoloRistoratore">
                                    Ristoratore
                                </label>
                            </div>
                        </div>
                    </div>

                    <div id="alertArea"></div>

                    <button type="submit" class="btn btn-primary mb-3 py-2">
                        <i class="bi bi-person-plus me-2"></i>Registrati
                    </button>

                    <div class="text-center mt-4">
                        <p>Hai già un account? <a href="index.html" class="text-decoration-none">Accedi</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="./src/register.js"></script>
</body>
</html>
